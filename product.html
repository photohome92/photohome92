<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product</title>

<link rel="stylesheet" href="./style.css">
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="brand">PhotoHome</div>
    <a href="index.html" class="back-btn">⬅ Back</a>
</div>

<!-- PRODUCT -->
<div class="product-page">

    <!-- IMAGE BOX -->
    <div class="img-box">
        <img id="mainImg" src="images/default.jpg">

        <div class="slider-btns">
            <button onclick="prevImg()">⬅</button>
            <button onclick="nextImg()">➡</button>
        </div>
    </div>

    <!-- DETAILS -->
    <div class="product-details">
        <h2 id="name">Loading...</h2>
        <p id="desc"></p>
        <h3 id="price"></h3>

        <button class="cart-btn-main" onclick="addToCartSingle()">
            🛒 Add To Cart
        </button>
    </div>

</div>

<script src="./script.js"></script>

<script>
/* ================= PRODUCT LOAD (UPGRADED) ================= */
document.addEventListener("DOMContentLoaded", () => {

let id = localStorage.getItem("product");

/* ❌ if no product */
if(id === null || !products[id]){
document.getElementById("name").innerText = "Product not found";
return;
}

let p = products[id];

/* TEXT */
document.getElementById("name").innerText = p.name;
document.getElementById("desc").innerText = p.desc;
document.getElementById("price").innerText = "Rs " + p.price;

/* SLIDER SETUP */
window.images = p.imgs || ["images/default.jpg"];
window.index = 0;

/* LOAD IMAGE */
showImg();

});
</script>

</body>
</html>
